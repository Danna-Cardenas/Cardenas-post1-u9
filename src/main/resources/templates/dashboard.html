<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Seguridad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar h1 {
            font-size: 24px;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            background: #667eea;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .navbar a:hover {
            background: #764ba2;
        }
        
        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .info {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .info p {
            font-size: 16px;
            color: #555;
            margin: 10px 0;
        }
        
        .menu-admin {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #ddd;
        }
        
        .menu-admin a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
            margin-right: 10px;
        }
        
        .menu-admin a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Dashboard</h1>
        <div>
            <span th:text="'Usuario: ' + ${username}"></span>
            <a th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </div>
    
    <div class="container">
        <h2>¡Bienvenido!</h2>
        
        <div class="info">
            <p><strong>Email registrado:</strong> <span th:text="${username}"></span></p>
            <p><strong>Estado:</strong> <span sec:authentication="principal.enabled ? 'Activo' : 'Inactivo'"></span></p>
        </div>
        
        <div sec:authorize="hasRole('ADMIN')" class="menu-admin">
            <h3>Acciones de Administrador</h3>
            <a th:href="@{/admin}">Panel de Administración</a>
        </div>
    </div>
</body>
</html>
